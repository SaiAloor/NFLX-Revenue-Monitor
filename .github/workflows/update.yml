name: Check EDGAR for a new earnings letter

on:
  schedule:
    # Weekdays at 13:30 UTC. Netflix reports after the US market close, so a
    # new letter is picked up the next morning.
    - cron: "30 13 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q
      - name: Check EDGAR and rebuild the report
        env:
          # The SEC asks automated tools to identify themselves with contact details.
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT || 'Sai Soumya Aloor saialoor@outlook.com' }}
        run: python update.py
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- data; then
            echo "No new earnings letter."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data outputs docs README.md
          git commit -m "Add $(python -c "import json;print(json.load(open('outputs/run_log.json'))['latest_quarter'])") earnings data from EDGAR"
          git push
      - name: Open an issue if the update failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Revenue monitor update failed ($(date -u +%Y-%m-%d))" \
            --body "The scheduled update stopped before saving anything, so the dataset is unchanged. See the run log: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
